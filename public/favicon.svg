<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="3"/>

  <g filter="url(#glow)">
    <!-- Hotel Building Silhouette -->
    <path d="M 28 104 L 28 48 L 48 38 L 48 104 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 100 104 L 100 48 L 80 38 L 80 104 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 48 38 L 80 38 L 80 104 L 48 104 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Building Windows -->
    <rect x="34" y="56" width="7" height="9" rx="1.5" fill="#38bdf8" opacity="0.9"/>
    <rect x="34" y="74" width="7" height="9" rx="1.5" fill="#38bdf8" opacity="0.9"/>
    <rect x="87" y="56" width="7" height="9" rx="1.5" fill="#c084fc" opacity="0.9"/>
    <rect x="87" y="74" width="7" height="9" rx="1.5" fill="#c084fc" opacity="0.9"/>

    <!-- Center Clock (Manager On Duty / Dispatcher Indicator) -->
    <circle cx="64" cy="60" r="19" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="4"/>
    <circle cx="64" cy="60" r="2.5" fill="#f8fafc"/>
    <!-- Clock Hands (10:10 Dispatch Time) -->
    <line x1="64" y1="60" x2="56" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="60" x2="74" y2="54" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

    <!-- Calendar Badge at Bottom Center -->
    <rect x="52" y="86" width="24" height="18" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <line x1="52" y1="92" x2="76" y2="92" stroke="#818cf8" stroke-width="2"/>
    <!-- Calendar Checkmark -->
    <path d="M 58 98 L 62 101 L 70 94" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
